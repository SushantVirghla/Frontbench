<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Speedometer / Benchmark Gauge Arc -->
  <path d="M 16 46 A 20 20 0 1 1 48 46" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
  <path d="M 16 46 A 20 20 0 1 1 45 23" fill="none" stroke="url(#arcGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Tick marks for benchmark levels -->
  <circle cx="16" cy="46" r="2" fill="#38bdf8" />
  <circle cx="16" cy="24" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="32" cy="12" r="2" fill="#38bdf8" />
  <circle cx="48" cy="24" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="48" cy="46" r="2" fill="#64748b" />

  <!-- High-Performance Lightning Needle / Center Core -->
  <polygon points="33,16 23,32 30,32 27,46 41,28 34,28" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- Data Explorer Grid Base Indicator -->
  <rect x="20" y="50" width="6" height="3" rx="1" fill="#38bdf8" />
  <rect x="29" y="50" width="6" height="3" rx="1" fill="#38bdf8" />
  <rect x="38" y="50" width="6" height="3" rx="1" fill="#38bdf8" />
</svg>